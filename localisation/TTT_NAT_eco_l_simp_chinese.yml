l_simp_chinese:
 ####动态修正###
 NAT_education_dynamic:0 "纳塔教育成果"
 NAT_education_dynamic_desc:0 "纳塔的教育仍然落后于提瓦特主要国家。学校稀少，教师不足，大部分知识仍靠部族口耳相传。"
 NAT_early_industry_dynamic:0 "纳塔工业建设成果"
 NAT_early_industry_dynamic_desc:0 "纳塔的工业体系刚刚建立，工厂效率低下，建设缓慢，民间消费品短缺，城市建筑空间不足。"

 ####教育与科技国策###
 NAT_eco_science_academy:0 "设立科学院"
 NAT_eco_science_academy_desc:0 "把散落在各部族的学者、铸名师与萨满聚集起来，建立纳塔第一个统一的科学机构。"
 NAT_eco_new_schools:0 "建设新学堂"
 NAT_eco_new_schools_desc:0 "在各部族聚居地兴办新式学校，让矿工、猎人和农民的孩子都能识字。"
 NAT_eco_train_teachers:0 "培养本国教师"
 NAT_eco_train_teachers_desc:0 "从各部族选拔有学问的人接受师范训练，让他们回到家乡教书。"
 NAT_eco_foreign_teachers:0 "聘请外国教师"
 NAT_eco_foreign_teachers_desc:0 "邀请枫丹、须弥的学者来纳塔任教，同时接受他们的生活方式。"
 NAT_eco_scholarships:0 "设立奖学金"
 NAT_eco_scholarships_desc:0 "为贫寒学生提供资助，让天赋不会被矿锄和渔网埋没。"
 NAT_eco_vocational_education:0 "重视职业教育"
 NAT_eco_vocational_education_desc:0 "在普通学堂之外建立技工学校，让教育与矿场、工坊直接相连。"
 NAT_eco_national_university:0 "成立国立大学"
 NAT_eco_national_university_desc:0 "把科学院、师范学校与技工学校合并为国立大学，纳塔终于有了自己的高等学府。"
 NAT_eco_encourage_innovation:0 "鼓励科学创新"
 NAT_eco_encourage_innovation_desc:0 "为发明者提供奖励与保护，让纳塔人敢于提出与旧传统不同的想法。"
 NAT_eco_buy_patents:0 "购买外国专利"
 NAT_eco_buy_patents_desc:0 "用外汇与矿石换取外国技术，绕过漫长的自主研发过程。"
 NAT_eco_reverse_engineering:0 "开展逆向工程"
 NAT_eco_reverse_engineering_desc:0 "拆解外国机器，研究它们的原理，必要时成立情报机构。"
 NAT_eco_phlogiston_engineering:0 "燃素工程学"
 NAT_eco_phlogiston_engineering_desc:0 "把燃素从燃料变成一门工程科学，纳塔的工业将获得前所未有的加速。"
 NAT_eco_optimize_process:0 "优化工业流程"
 NAT_eco_optimize_process_desc:0 "用科学方法重新安排矿场、工坊与运输环节。"
 NAT_eco_tech_benefit:0 "从技术进步获益"
 NAT_eco_tech_benefit_desc:0 "当工厂数量超过五十座时，新技术终于有了足够大的试验场。"
 NAT_eco_continue_industrialize:0 "继续工业化"
 NAT_eco_continue_industrialize_desc:0 "把工业从火山脚下推向各部族，让机器成为纳塔的第二位火神。"
 NAT_eco_import_machines:0 "进口外国机器"
 NAT_eco_import_machines_desc:0 "从枫丹购买机床与蒸汽设备，首都将建立第一批现代工厂。"
 NAT_eco_prospect_resources:0 "勘探可用资源"
 NAT_eco_prospect_resources_desc:0 "系统勘探矿脉、林场与地热资源，解锁资源开发决议。"
 NAT_eco_refining_factory:0 "金属精炼"
 NAT_eco_refining_factory_desc:0 "通过精炼金属，我们将离工业化更进一步"
 NAT_eco_local_company:0 "成立本土建筑公司"
 NAT_eco_local_company_desc:0 "让纳塔人自己设计道路、桥梁与厂房。"
 NAT_eco_mass_infrastructure:0 "大规模基础设施建设"
 NAT_eco_mass_infrastructure_desc:0 "用本土建筑公司开展全国基建，并进入建设狂潮。"
 NAT_eco_machine_makes_machine:0 "以机器制造机器"
 NAT_eco_machine_makes_machine_desc:0 "当工厂数量超过六十座时，纳塔可以用机器生产机器。"
 NAT_eco_agriculture:0 "重视农业发展"
 NAT_eco_agriculture_desc:0 "工业不能代替粮食。纳塔必须让土地与工厂同样受到重视。"
 NAT_eco_reclaim_land:0 "开垦荒地"
 NAT_eco_reclaim_land_desc:0 "在荒原与火山坡地开垦新的农田。"
 NAT_eco_measure_land:0 "丈量土地"
 NAT_eco_measure_land_desc:0 "重新丈量纳塔土地，明确每块土地的所有者与用途。"
 NAT_eco_fertilizer_factory:0 "建设化肥厂"
 NAT_eco_fertilizer_factory_desc:0 "用工厂生产肥料，让贫瘠的土地也能丰收。"
 NAT_eco_mechanized_agriculture:0 "农业机械化"
 NAT_eco_mechanized_agriculture_desc:0 "把机器引入农田，解放更多人手进入工厂与军队。"
 NAT_eco_bountiful_fields:0 "在丰饶的田野上"
 NAT_eco_bountiful_fields_desc:0 "当土地、肥料与机器结合，纳塔人第一次看到真正的丰饶。"
 NAT_eco_better_tomorrow:0 "迈向更美好的明天"
 NAT_eco_better_tomorrow_desc:0 "教育、工业与农业同时完成升级，纳塔终于开始追赶其他国家。"

