 ####经济事件###
 NAT_eco_events.1.t:0 "第一课"
 NAT_eco_events.1.d:0 "新学堂开学的第一天，回声之子矿区的一个孩子迟到了。他摊开手，给老师看掌心的矿石粉末：\"我想让这块石头也知道今天要上课。\"\n\n老师没有生气，只是把石头放在讲台上，对全班说：\"那我们从这块石头讲起。\"\n\n窗外的矿车依然在响，但教室里第一次有了读书声。"
 NAT_eco_events.1.a:0 "教育从一块石头开始。"
 NAT_idea_eco_science_academy:0 "科学院"
 NAT_idea_eco_science_academy_desc:0 "纳塔有了统一的科学研究机构，科研速度略有提高。"
 NAT_idea_construction_boom:0 "建设狂潮"
 NAT_idea_construction_boom_desc:0 "全国上下掀起建设热潮，建筑速度大幅提高。"
 NAT_patent_purchase:0 "购买专利"
 NAT_patent_purchase_desc:0 "以外汇与工业产能为代价，引进外国技术。"
 NAT_buy_patent:0 "购买外国专利"
 NAT_buy_patent_desc:0 "占用2座民用工厂90天，随机获得两张科技加速卡。90天冷却。"
