 ####经济决议分类###
 NAT_general_construction:0 "通用建设"
 NAT_general_construction_desc:0 "以民用工厂与政治资源为代价，在纳塔各地修建新的工业设施。"
 NAT_land_reclamation:0 "开垦荒地"
 NAT_land_reclamation_desc:0 "组织拓荒队开垦可耕种土地，将荒芜地区逐步升级为城镇。"
 NAT_resource_development:0 "资源开发"
 NAT_resource_development_desc:0 "对已知矿脉与林地进行系统性开发，提高纳塔的资源产量。"

 ####通用建设决议###
 NAT_build_civilian_factory:0 "修建民用工厂"
 NAT_build_civilian_factory_desc:0 "占用3座民用工厂90天，在纳塔的随机地区新建1座民用工厂。"
 NAT_build_military_factory:0 "修建军用工厂"
 NAT_build_military_factory_desc:0 "占用3座民用工厂90天，在纳塔的随机地区新建1座军用工厂。"
 NAT_build_dockyard:0 "修建船坞"
 NAT_build_dockyard_desc:0 "占用3座民用工厂90天，在纳塔的沿海地区新建1座船坞。"
 NAT_general_construction_tt:0 "施工期间将有3座民用工厂被临时占用。"

 ####开垦荒地决议###
 NAT_reclaim_wasteland:0 "开垦荒地"
 NAT_reclaim_wasteland_desc:0 "占用2座民用工厂120天，将目标地区的开发等级提升一级。仅限纳塔已完全控制的地区使用。"
 NAT_land_reclamation_tt:0 "施工期间将有2座民用工厂被临时占用。"

 ####资源开发决议###
 NAT_resource_dev_351:0 "开发林地与橡胶园"
 NAT_resource_dev_351_desc:0 "占用3座民用工厂90天，开发该地区的木材与橡胶资源。"
 NAT_resource_dev_348:0 "开发林地"
 NAT_resource_dev_348_desc:0 "占用3座民用工厂90天，开发该地区的木材资源。"
 NAT_resource_dev_327:0 "开发煤矿与粮田"
 NAT_resource_dev_327_desc:0 "占用3座民用工厂90天，开发该地区的煤炭与粮食资源。"
 NAT_resource_development_tt:0 "施工期间将有3座民用工厂被临时占用。"
