 OTHER_GATHERING_NAT_DESC:0 "纳塔紧邻深渊前线，六部族奉火神玛薇卡为统帅，通过归火圣夜巡礼决定由谁继承圣火。图兰火山供给燃素与矿藏，也让这个国家长期暴露在黑色太阳的威胁下。1999年，深渊裂口增多，至冬先遣队进入北境；战争、部族与地脉三件事正在同时逼近纳塔。\n\n当前纳塔内容仍在制作中。"

 ####民族精神###
 NAT_idea_abyss_frontline:0 "深渊前线"
 NAT_idea_abyss_frontline_desc:0 "深渊对纳塔地脉的侵蚀持续了几百年。黑色太阳每出现一次，夜神之国边境就会多出新的裂口；各部族都损失过不止一代战士，村落居民也早已熟悉警报声。战争已经是日常生活的一部分，人们很少谈论停战，只希望明天的太阳照常升起。"
 NAT_idea_abyss_frontline_2:0 "深渊前线"
 NAT_idea_abyss_frontline_2_desc:0 "深渊对纳塔地脉的侵蚀持续了几百年。黑色太阳每出现一次，夜神之国边境就会多出新的裂口；各部族都损失过不止一代战士，村落居民也早已熟悉警报声。战争已经是日常生活的一部分，人们很少谈论停战，只希望明天的太阳照常升起。"
 NAT_idea_abyss_frontline_3:0 "深渊前线"
 NAT_idea_abyss_frontline_3_desc:0 "深渊对纳塔地脉的侵蚀持续了几百年。黑色太阳每出现一次，夜神之国边境就会多出新的裂口；各部族都损失过不止一代战士，村落居民也早已熟悉警报声。战争已经是日常生活的一部分，人们很少谈论停战，只希望明天的太阳照常升起。"
 NAT_idea_abyss_frontline_4:0 "深渊前线"
 NAT_idea_abyss_frontline_4_desc:0 "深渊对纳塔地脉的侵蚀持续了几百年。黑色太阳每出现一次，夜神之国边境就会多出新的裂口；各部族都损失过不止一代战士，村落居民也早已熟悉警报声。战争已经是日常生活的一部分，人们很少谈论停战，只希望明天的太阳照常升起。"
 NAT_idea_six_tribes_covenant:0 "六部族盟约"
 NAT_idea_six_tribes_covenant_desc:0 "回声之子、流泉之众、悬木人、花羽会、沃陆之邦与烟谜主共同承认火神为最高统帅，同时保留各自的大灵、习俗和战士。盟约让六部族在深渊面前共同作战，部族间的竞争与荣誉之争却没有停止。"
 NAT_idea_phlogiston_economy:0 "燃素经济"
 NAT_idea_phlogiston_economy_desc:0 "燃素支撑着纳塔的矿场、工坊、驰轮车和部族武装。这种能量来自地脉，龙族留下的秘源机关仍在使用，但原理已经少有人懂。工业因此运转，也离不开火山与矿脉。"
 NAT_idea_death_and_ode:0 "死亡代价与还魂诗"
 NAT_idea_death_and_ode_desc:0 "夜神之国保存英雄的古名。古名不被磨灭，亡者就能经还魂诗归来，代价是有人付出记忆、寿命或生命。玛薇卡公布了她与死之执政的契约：她以自身为燃料，换取纳塔存续的机会。"

 ####人物###
 NAT_Mavuika:0 "玛薇卡"
 NAT_Mavuika_desc:0 "纳塔火神，古名「基扬戈兹」的继承者。五百年前，她留下记忆与爱作燃料，布下集结六部族英雄、与深渊决战的长远计划；如今从圣火中归来，六部族都追随她。"
 NAT_Kachina:0 "卡齐娜"
 NAT_Kachina_leader_desc:0 "回声之子的年轻英雄，古名「乌沙博蒂」的继承者。她曾独自穿过夜神之国，资质不算出众，却总在失败后先站起来，再哭。"
 NAT_Xilonen:0 "希诺宁"
 NAT_Mualani:0 "玛拉妮"
 NAT_Kinich:0 "基尼奇"
 NAT_Chasca:0 "恰斯卡"
 NAT_Iansan:0 "伊安珊"
 NAT_Varesa:0 "瓦雷莎"
 NAT_Citlali:0 "茜特菈莉"
 NAT_Ororon:0 "欧洛伦"
 NAT_Ifa:0 "伊法"
 NAT_Capitano:0 "「队长」卡皮塔诺"
 NAT_Capitano_desc:0 "愚人众第一席，来自坎瑞亚的天柱骑士，背负不死诅咒。他进入纳塔的目标是重构地脉；作为交换，他愿意让自己永远留在夜神之国的王座上。"
 NAT_Xbalanque:0 "希巴拉克"
 NAT_Xbalanque_desc:0 "初代火神。传说他窃取龙族的火种交给人类，点燃了纳塔的文明。千年后，这个传说中的人物以意料之外的方式重新出现。"
 NAT_Ochkan:0 "奥奇坎"
 NAT_Ochkan_desc:0 "烬城奥奇卡纳塔的半龙暴君，千年前被讨伐。他的崇拜者仍藏在暗处，等待圣火熄灭。"
 NAT_Gosoythoth:0 "古斯托特"
 NAT_Gosoythoth_desc:0 "深渊本体，悬在纳塔天空的黑色太阳。它不统治任何人，只是存在，夜神之国与地脉便随之衰败。"

