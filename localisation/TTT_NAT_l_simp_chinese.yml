 ####将军特质###
 NAT_ode_of_flame_commander:0 "炽烈的还魂诗"
 NAT_usha_botti_commander:0 "先站起来再哭"
 NAT_forge_of_names_commander:0 "磐岩铸名"
 NAT_springs_guide_commander:0 "逐浪客"
 NAT_dragon_hunter_commander:0 "维茨特兰的猎手"
 NAT_peacemaker_commander:0 "巡宇翦定"
 NAT_strength_commander:0 "沃贡贡之血"
 NAT_varesa_commander:0 "勇气而非怒火"
 NAT_bat_soul_commander:0 "夜蝠之眼"
 NAT_sentinel_commander:0 "不动的天柱"
 NAT_first_flame_commander:0 "初火远征"
 NAT_ochkan_commander:0 "烬城之爪"
 NAT_ode_of_flame_commander_desc:0 "以圣火为号。玛薇卡麾下的部队在炎地与夜战中都能保持攻势。"
 NAT_usha_botti_commander_desc:0 "古名「乌沙博蒂」教给卡齐娜的战术：先站稳，再反击。"
 NAT_forge_of_names_commander_desc:0 "希诺宁像铸造古名一样整训部队，要求每支分队都能在战线上独立支撑。"
 NAT_springs_guide_commander_desc:0 "玛拉妮熟悉纳塔的洋流与浅滩，指挥的船队航速快，补给消耗低。"
 NAT_dragon_hunter_commander_desc:0 "基尼奇习惯山地与密林，部队在复杂地形中移动更稳，进攻也更果断。"
 NAT_peacemaker_commander_desc:0 "恰斯卡靠侦察和速度结束冲突，常在敌人列阵前完成穿插。"
 NAT_strength_commander_desc:0 "伊安珊相信力量来自训练，经她整训的部队冲击力更强。"
 NAT_varesa_commander_desc:0 "瓦雷莎把愤怒换成勇气后，打得更加难缠，防守也不再莽撞。"
 NAT_bat_soul_commander_desc:0 "欧洛伦在夜间也能看清战线，擅长侦察与渗透。"
 NAT_sentinel_commander_desc:0 "卡皮塔诺的部队钉在阵地上，补给消耗低，组织度稳固。"
 NAT_first_flame_commander_desc:0 "希巴拉克以初火统军，部队在炎热地带和攻坚战中都能保持攻势。"
 NAT_ochkan_commander_desc:0 "奥奇坎的部队擅长突破，代价是阵线比寻常军队更脆。"

 ####开局国家介绍（欢迎界面）###
 TTT_NAT_title:0 "§R纳塔，战争的国度§!"
 TTT_NAT_DESC_PAGE_1:0 "§r纳塔是离深渊最近的国度。图兰大火山终年落灰，夜神之国的地脉被深渊侵蚀，黑色太阳每隔一段岁月就会逼近天空。\n火神之位不靠血脉。任何部族战士在「归火圣夜巡礼」中证明自己最强，就能继承圣火与古名。玛薇卡五百年前制定了计划，以记忆和生命为燃料，等待在她的时代集齐六部族英雄。\n1999年，黑日逼近，巡礼开幕。六部族都在整备武器，准备迎接英雄或死亡。§!"
 TTT_NAT_DESC_PAGE_2:0 "§r六部族构成纳塔的骨架：回声之子采掘群山，流泉之众经营温泉与海岸航线，悬木人猎龙，花羽会与绒翼龙共用天空，沃陆之邦提供粮食和战士，烟谜主用织物记录亡者的名字。\n部族与中央的关系正在收紧。深渊频繁越境，矿场和油田不能停工；玛薇卡的内阁要更多兵员，长老们要更多自治。\n至冬先遣队已经进入北境，愚人众第一席「队长」亲自到场。他声称只关心地脉，但纳塔人记得，至冬的援助从来没有免费过。§!"

 TTT_Natlan_title:0 "§r纳塔大地：火山、矿脉与夜神之国§!"
 TTT_Natlan_desc:0 "§r纳塔地表由火山、峡谷、温泉和矿区组成。图兰大火山是中心，地脉涌出的燃素驱动工坊与驰轮车；流泉之众控制北方海岸与航线，悬木人的猎场在南方群山里。\n夜神之国不在普通地图上。它由死之执政协助建立，是地脉深处的空间：古名在这里被保存，死者等待还魂诗。\n纳塔人把土地看作战场的一部分。矿场下方可能有深渊裂口，温泉河畔可能埋着旧日的遗骨。§!"

