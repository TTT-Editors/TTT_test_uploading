l_simp_chinese:
 ####第二阶段国策###
 NAT_phase2_fire_god_plan:0 "火神的计划"
 NAT_phase2_fire_god_plan_desc:0 "玛薇卡早已不是第一次面对深渊。五百年前她以自己为燃料布下计划；如今，她要将这个计划重新展开，让六部族按照她的意志走向决战。"
 NAT_phase2_night_warden_war:0 "巡夜者战争"
 NAT_phase2_night_warden_war_desc:0 "夜神之国与地面的边界正在模糊。玛薇卡命令巡夜者不再被动防守，而是主动进入夜神之国边缘清剿深渊据点，为后续决战争取空间。"
 NAT_phase2_tribal_history:0 "梳理各部族历史遗产"
 NAT_phase2_tribal_history_desc:0 "烟谜主的织物、回声之子的矿脉、花羽会的飞行传说……每一段历史都是纳塔的武器。玛薇卡下令整理各部族遗产，从古名中寻找被遗忘的力量。"
 NAT_phase2_unite_natlan:0 "团结纳塔人"
 NAT_phase2_unite_natlan_desc:0 "战争会让纳塔分裂，也会让纳塔凝聚。玛薇卡要在深渊到来之前，让六部族明白：他们争夺的是同一个太阳。"
 NAT_phase2_political_mobilization:0 "政治动员"
 NAT_phase2_political_mobilization_desc:0 "话事处、部族长老、大萨满与商会代表被召集起来。玛薇卡需要的不只是士兵，还有整个纳塔的意志。"
 NAT_phase2_train_army:0 "训练军队"
 NAT_phase2_train_army_desc:0 "将民兵、猎龙人、飞行骑手和矿工战士整编为同一支军队，统一训练、统一补给、统一指挥。"
 NAT_phase2_industry_mobilization:0 "工业动员"
 NAT_phase2_industry_mobilization_desc:0 "矿场、精炼厂、军工作坊全部转入战时节奏。燃素将不再只是燃料，而是纳塔的弹药。"
 NAT_phase2_probe_abyss:0 "试探性进攻深渊"
 NAT_phase2_probe_abyss_desc:0 "在全面开战之前，先打一场小规模试探战。确认深渊的兵力部署、弱点与裂口分布。"
 NAT_phase2_elite_army:0 "精兵路线"
 NAT_phase2_elite_army_desc:0 "集中资源训练少数精锐，以古名英雄为核心，打造一支能在夜神之国深处作战的尖刀。"
 NAT_phase2_total_mobilization:0 "全民动员路线"
 NAT_phase2_total_mobilization_desc:0 "让每一个能拿起武器的纳塔人都上战场。数量本身也是一种力量。"
 NAT_phase2_war_economy:0 "一切为了战争"
 NAT_phase2_war_economy_desc:0 "削减民用生产，将所有工厂、矿场与人力投入军工。纳塔没有余裕照顾和平时期的体面。"
 NAT_phase2_people_livelihood:0 "保障民生"
 NAT_phase2_people_livelihood_desc:0 "即使战争再残酷，也不能让后方的人饿死。保留部分民用产能，维持粮食、住房与基本医疗。"
 NAT_phase2_quick_expel:0 "快速驱逐深渊"
 NAT_phase2_quick_expel_desc:0 "集中力量打开一条通往黑日的道路，以一次决定性的会战结束战争。"
 NAT_phase2_protracted_war:0 "持久战"
 NAT_phase2_protracted_war_desc:0 "深渊无法被一次冲锋消灭。纳塔要建立防线、储备物资、消耗深渊，等待它自己崩溃。"
 NAT_phase2_centralize:0 "中央集权"
 NAT_phase2_centralize_desc:0 "战争期间，所有部族都必须服从火神与最高指挥部的命令。效率高于传统。"
 NAT_phase2_tribal_autonomy:0 "部族自治"
 NAT_phase2_tribal_autonomy_desc:0 "让各部族按自己的方式组织战斗与生产，中央只负责协调与补给。信任本身就是凝聚力。"
 NAT_phase2_ancient_names:0 "古名复兴"
 NAT_phase2_ancient_names_desc:0 "重新寻找失落古名，让过去的英雄以新的方式回到纳塔。"
 NAT_phase2_new_symbols:0 "新纳塔象征"
 NAT_phase2_new_symbols_desc:0 "不再只依赖过去的传说。纳塔需要属于这一代人的旗帜、口号与信仰。"
 NAT_phase2_recon_offensive:0 "侦察攻势"
 NAT_phase2_recon_offensive_desc:0 "派出小队深入裂口周边，用一次次小规模接触摸清深渊的防线。"
 NAT_phase2_border_fortress:0 "边境堡垒"
 NAT_phase2_border_fortress_desc:0 "在已知裂口外围修建堡垒与补给站，把边境变成绞肉机。"
 NAT_phase2_phlogiston_artillery:0 "燃素炮兵"
 NAT_phase2_phlogiston_artillery_desc:0 "将燃素转化为炮弹，让纳塔的炮兵拥有撕开深渊防线的火力。"
 NAT_phase2_air_support:0 "花羽会空中支援"
 NAT_phase2_air_support_desc:0 "绒翼龙骑手将从空中为地面部队提供侦察与打击支援。"
 NAT_phase2_navy_coast:0 "海岸巡防"
 NAT_phase2_navy_coast_desc:0 "建立纳塔海岸巡逻力量，防止深渊从海上方向渗透。"
 NAT_phase2_hero_training:0 "英雄特训"
 NAT_phase2_hero_training_desc:0 "对古名持有者进行针对性训练，让他们在夜神之国中也能保持清醒与战斗力。"
 NAT_phase2_final_mobilization:0 "最终动员"
 NAT_phase2_final_mobilization_desc:0 "所有准备都已就绪。纳塔将进入决战状态，向深渊亮出全部火焰。"

 ####队长事件###
 NAT_capitano_events.1.t:0 "【队长】到来"
 NAT_capitano_events.1.d:0 "至冬愚人众第一席「队长」卡皮塔诺抵达纳塔。他没有带军队，只带了几名随从，却让整个话事处都感受到了压力。\n\n他说他愿意帮助纳塔击退深渊，但他要求先见火神。"
 NAT_capitano_events.1.a:0 "让他进来。"
 NAT_capitano_events.2.t:0 "会面"
 NAT_capitano_events.2.d:0 "玛薇卡与队长在圣火竞技场的一间偏厅会面。队长没有寒暄，直接摊开一张地脉图。\n\n「你们的古名、还魂诗、夜神之国，都是旧时代的锁链。我可以帮你们斩断它们，但你们要允许我走遍纳塔，亲自确认地脉的伤口。」\n\n玛薇卡沉默片刻，没有拒绝。"
 NAT_capitano_events.2.a:0 "让他调查，但派人盯着他。"
 NAT_capitano_events.3.t:0 "密谋"
 NAT_capitano_events.3.d:0 "队长在纳塔的这段时间，比任何人预想的都要深入。他走遍烟谜主的织房、回声之子的矿洞、花羽会的天空，最后把目光落在欧洛伦身上。\n\n欧洛伦是灵魂残缺之人，却也因此能与地脉深处共鸣。队长告诉他：纳塔的地脉已经被深渊污染到无法修复，唯一的方法是重写它——连同历史、古名和记忆一起。\n\n欧洛伦没有回答，但他没有离开。"
 NAT_capitano_events.3.a:0 "他们到底在计划什么？"
 NAT_capitano_events.4.t:0 "最后一刻"
 NAT_capitano_events.4.d:0 "玛薇卡从烟谜主的情报网中得知了队长的真正计划：他要重写纳塔的地脉与历史结构。这不是治疗，而是替换。\n\n她大为惊骇，立刻召集恰斯卡与希诺宁，赶往夜神之国的入口。"
 NAT_capitano_events.4.a:0 "绝不能让他动手！"
 NAT_capitano_events.5.t:0 "对峙"
 NAT_capitano_events.5.d:0 "夜神之国入口，巨大的秘源装置已经启动。队长站在装置前，欧洛伦站在他身旁。\n\n「你骗了我。」欧洛伦的声音很轻。\n\n「我没有骗你。」队长说，「我只是没有告诉你全部。」\n\n就在队长犹豫是否按下最后开关时，玛薇卡一行人赶到。火光照亮装置，也照亮了所有人的脸。"
 NAT_capitano_events.5.a:0 "装置在最后一刻关掉了。"
 NAT_capitano_arrived_tt:0 "§Y【队长】卡皮塔诺§!已变得可用。"
 NAT_capitano_plan_failed_tt:0 "§R【队长】的计划失败§!：秘源装置在最后一刻被关闭，地脉没有被重写。"
