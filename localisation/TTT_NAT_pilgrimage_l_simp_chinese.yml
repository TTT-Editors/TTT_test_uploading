l_simp_chinese:
 ####归火圣夜巡礼准备国策###
 NAT_prep_hear_report:0 "听取话事处汇报"
 NAT_prep_hear_report_desc:0 "玛薇卡归来的第一件事，不是发号施令，而是坐回话事处的圆桌。她需要知道这一年里纳塔发生了什么：矿场产量、部族摩擦、深渊裂口、粮仓余量，以及谁在暗中等待圣火熄灭。"
 NAT_prep_mavuika_tour:0 "火神走访各地"
 NAT_prep_mavuika_tour_desc:0 "玛薇卡决定亲自走一遍六部族。她要去回声之子的矿洞、流泉之众的港口、悬木人的猎场、花羽会的天空、沃陆之邦的田野和烟谜主的织房。传说只是传说，亲眼看见的纳塔才是她需要守护的纳塔。"
 NAT_prep_maintain_flame:0 "维护圣火"
 NAT_prep_maintain_flame_desc:0 "圣火重新燃起，但火苗还很年轻。玛薇卡与烟谜主、铸名师一同检查火盆、燃素回路和竞技场的地脉节点，确保巡礼期间圣火不会中途黯淡。"
 NAT_prep_notify_tribes:0 "通知各地部落"
 NAT_prep_notify_tribes_desc:0 "归火圣夜巡礼不是只有竞技场里的比赛。每个部族都需要提前知道赛程、名额、驻地和补给安排。信使、绒翼龙和驰轮车将同时出发，把消息送到纳塔的每一个角落。"
 NAT_prep_arena_repair:0 "修缮竞技场"
 NAT_prep_arena_repair_desc:0 "话事处过去一年只是修补了看台。现在玛薇卡要求以巡礼标准重建赛道、加固选手通道、扩大医疗区，并给各国观察员留出足够安全的席位。"
 NAT_prep_transport:0 "保障交通运输"
 NAT_prep_transport_desc:0 "巡礼期间，六部族的人流、物资和燃素会同时涌向圣火竞技场。玛薇卡命令优先修复主干道、增设驿站和补给点，让任何人都不会因为道路问题错过归火之夜。"
 NAT_prep_grand_pilgrimage:0 "归火盛夜巡礼"
 NAT_prep_grand_pilgrimage_desc:0 "所有准备都已就绪。六部族的代表、战士、萨满和旁观者正在向圣火竞技场汇聚。这是玛薇卡归来后的第一场盛大巡礼，也是纳塔向深渊宣告自己仍然活着的方式。"

 ####危机浮现国策###
 NAT_crisis_emergence:0 "危机浮现"
 NAT_crisis_emergence_desc:0 "巡礼的火焰尚未燃尽，夜神之国却传来了坏消息：卡齐娜的古名没有回应还魂诗。她被困在夜神之国的深处，而深渊的气息正在沿着她留下的痕迹向上蔓延。"
 NAT_crisis_hear_reports:0 "听取各部汇报"
 NAT_crisis_hear_reports_desc:0 "玛薇卡再次召集话事处。各部族汇报边境情况、失踪人数和深渊裂口位置。卡齐娜的失败不是孤立事件，而是纳塔地脉正在加速崩坏的信号。"
 NAT_crisis_tour_tribes:0 "走访部族"
 NAT_crisis_tour_tribes_desc:0 "火神亲自前往受创最重的花羽会、悬木人和流泉之众。她需要知道哪些部族还能抽调战士，哪些部族已经连日常巡逻都难以维持。"
 NAT_crisis_recon_abyss:0 "深渊侦察"
 NAT_crisis_recon_abyss_desc:0 "派遣侦察队沿裂口外围活动，记录深渊魔物的种类、数量与移动方向。为下一步封堵裂口提供情报。"
 NAT_crisis_night_kingdom_scout:0 "夜神之国侦察"
 NAT_crisis_night_kingdom_scout_desc:0 "烟谜主和欧洛伦进入夜神之国边缘，寻找卡齐娜古名的痕迹，同时确认地脉深处的裂口是否已经扩大到足以影响现实。"
 NAT_crisis_phlogiston_mobilize:0 "燃素动员"
 NAT_crisis_phlogiston_mobilize_desc:0 "将各地燃素储备集中调配，优先供应侦察队、边境哨所和即将出发的救援队伍。"
 NAT_crisis_tribal_militia:0 "部族民兵"
 NAT_crisis_tribal_militia_desc:0 "向六部族下达民兵动员令。不是全面战争，但每个部族都要准备至少一支能立即出发的战斗队伍。"
 NAT_crisis_transport:0 "运输保障"
 NAT_crisis_transport_desc:0 "在巡礼运输网的基础上建立应急通道，确保部队和物资能同时向北境和夜神之国入口输送。"
 NAT_crisis_arena_repair:0 "竞技场转为指挥部"
 NAT_crisis_arena_repair_desc:0 "圣火竞技场暂时从庆典场地转为战时指挥部。看台下的房间被改成通信室、医疗站和临时兵营。"
 NAT_crisis_warning_network:0 "警报网"
 NAT_crisis_warning_network_desc:0 "用烟谜主的织物和绒翼龙建立覆盖六部族的警报网，确保任何裂口出现都能在半天内传遍纳塔。"
 NAT_crisis_save_kachina:0 "拯救卡齐娜"
 NAT_crisis_save_kachina_desc:0 "卡齐娜的古名仍没有熄灭，说明她还活着。但夜神之国深处危险重重，谁去救她，谁留下守地面，必须立刻做出决断。"
 NAT_crisis_rescue_prep:0 "救援准备"
 NAT_crisis_rescue_prep_desc:0 "为进入夜神之国的小队准备燃素灯、地脉罗盘、药品和应急还魂诗卷轴。"
 NAT_crisis_guard_ground:0 "地面留守"
 NAT_crisis_guard_ground_desc:0 "无论谁进入夜神之国，地面都必须留下足够的力量。深渊随时可能趁火神不在时发动突袭。"
 NAT_crisis_abyss_breach_seal:0 "封堵裂口"
 NAT_crisis_abyss_breach_seal_desc:0 "趁深渊主力尚未涌出，用燃素和岩元素工事封堵已知裂口，为救援争取时间。"
 NAT_crisis_mavuika_fuel:0 "火神燃料"
 NAT_crisis_mavuika_fuel_desc:0 "玛薇卡将自己的生命燃素注入圣火，为可能需要的还魂诗或夜神之国远征储备力量。"
 NAT_crisis_dragon_scouts:0 "龙骑侦察"
 NAT_crisis_dragon_scouts_desc:0 "花羽会与绒翼龙骑手从空中监视深渊动向，并为地面部队提供实时情报。"
 NAT_crisis_heroes_muster:0 "英雄集结"
 NAT_crisis_heroes_muster_desc:0 "玛薇卡召集各部族最可靠的战士，准备组成一支能够应对夜神之国深处威胁的精锐队伍。"
 NAT_crisis_ode_prepare:0 "还魂诗准备"
 NAT_crisis_ode_prepare_desc:0 "烟谜主开始为可能的牺牲者准备还魂诗。没有人希望用到它，但纳塔从不把希望寄托在运气上。"
 NAT_crisis_final_survey:0 "决战前调查"
 NAT_crisis_final_survey_desc:0 "汇总侦察、忠诚、燃料和军力情报，确定下一步是救援优先，还是先封堵深渊。"
 NAT_crisis_pilgrimage_emergency:0 "紧急巡礼"
 NAT_crisis_pilgrimage_emergency_desc:0 "在全面战争到来之前，举行一场简短而庄重的巡礼，让六部族在圣火面前立誓：无论谁倒下，纳塔都不会退后。"

 ####事件###
 NAT_prep_events.1.t:0 "归火盛夜巡礼开幕"
 NAT_prep_events.1.d:0 "圣火竞技场人声鼎沸。六部族的旗帜在燃素火盆上方交错，来自各国的观察员坐在新修的看台上。玛薇卡走上高台，没有长篇演说，只是举起手，让火焰照亮整个夜空。\n\n「归火盛夜巡礼，开始。」\n\n欢呼声几乎掀翻屋顶。"
 NAT_prep_events.1.a:0 "愿圣火照亮所有归途。"
 NAT_prep_events.2.t:0 "卡齐娜复活失败"
 NAT_prep_events.2.d:0 "巡礼进行到第二十八天，夜神之国突然剧烈震动。烟谜主大萨满手中的织物同时断裂，卡齐娜的古名在还魂诗仪式中剧烈闪烁，最终没有回到现实。\n\n她仍然活着——古名没有熄灭——但她被更深地拖入了夜神之国。仪式失败的消息像野火一样传遍纳塔，刚刚燃起的希望瞬间蒙上阴影。"
 NAT_prep_events.2.a:0 "必须把她带回来。"
 NAT_crisis_events.1.t:0 "危机浮现"
 NAT_crisis_events.1.d:0 "卡齐娜的失败让纳塔第一次意识到：归火圣夜巡礼不只是庆典，也是纳塔地脉的一次公开体检。现在，体检结果出来了——地脉正在生病，而卡齐娜被留在了病灶深处。"
 NAT_crisis_events.1.a:0 "准备行动。"
 NAT_crisis_events.10.t:0 "决断"
 NAT_crisis_events.10.d:0 "话事处里争论不休。卡齐娜的位置已经确定，但夜神之国深处随时可能塌陷，深渊魔物也在边境蠢蠢欲动。\n\n「我去。」玛薇卡说。\n\n「不行。」玛拉妮立刻反对，「地面需要你。如果你离开时深渊大举入侵，纳塔连一面旗帜都举不起来。」\n\n基尼奇靠在墙上，语气平淡：「她说得对。我们三个人去就够了。」\n\n恰斯卡没有反对，只是摸了摸腰间的枪：「但如果我们都回不来，纳塔会记住是谁带走了卡齐娜吗？」"
 NAT_crisis_events.10.a:0 "玛薇卡亲自进入夜神之国。"
 NAT_crisis_events.10.b:0 "让玛拉妮、基尼奇和恰斯卡去。"
 NAT_crisis_events.11.t:0 "救回卡齐娜"
 NAT_crisis_events.11.d:0 "二十五天后，夜神之国的出口终于亮起。卡齐娜被搀扶着走出来，身上满是尘与血，但古名仍在燃烧。\n\n救援队带回了她，也带回了夜神之国深处的第一手情报：深渊正在地脉里挖一条通往地面的路。"
 NAT_crisis_events.11.a:0 "欢迎回来，卡齐娜。"
 NAT_crisis_events.12.t:0 "伤势恢复"
 NAT_crisis_events.12.d:0 "玛拉妮、基尼奇与恰斯卡的伤口已经愈合。夜神之国留下的伤痛没有击倒他们，反而让他们更清楚深渊的底细。"
 NAT_crisis_events.12.a:0 "辛苦了。"
 NAT_crisis_events.13.t:0 "卡齐娜伤势恢复"
 NAT_crisis_events.13.d:0 "经过长时间休养，卡齐娜终于从夜神之国带回来的伤势中恢复。古名「乌沙博蒂」依旧坚固，她随时可以重新站上战场。"
 NAT_crisis_events.13.a:0 "欢迎归队。"
 NAT_crisis_events.20.t:0 "前期准备完成"
 NAT_crisis_events.20.d:0 "危机尚未结束，但纳塔已经不再被动。侦察、封堵、救援和战争准备都在同步推进。玛薇卡站在圣火前，知道下一步将决定纳塔是否还能继续存在。"
 NAT_crisis_events.20.a:0 "向深渊亮出我们的火。"
 NAT_news_events.31.t:0 "纳塔：归火盛夜巡礼开幕"
 NAT_news_events.31.d:0 "在火神玛薇卡归来后，纳塔圣火竞技场正式拉开归火盛夜巡礼的帷幕。六部族代表、战士与外国观察员齐聚一堂，这是近年来纳塔规模最大的一次公开盛会。"
 NAT_news_events.31.a:0 "圣火不息，战争不止。"
 NAT_news_events.31.b:0 "纳塔的盛典总是很短。"
 NAT_news_events.32.t:0 "纳塔：巡礼中断，英雄卡齐娜困于夜神之国"
 NAT_news_events.32.d:0 "归火盛夜巡礼进行到第二十八天时突然中断。据纳塔官方消息，古名「乌沙博蒂」的继承者卡齐娜在还魂诗仪式中未能返回现实，目前仍被困在夜神之国深处。\n\n火神玛薇卡已宣布进入紧急状态，各部族正在集结。"
 NAT_news_events.32.a:0 "愿她平安归来。"

 ####tooltip###
 NAT_kachina_unavailable_tt:0 "§R卡齐娜暂时不可用、不可见§!：她被困在夜神之国深处。"
 NAT_kachina_saved_tt:0 "§G卡齐娜已恢复可用§!，但身上带有「受伤」特质。"
 NAT_prep_pilgrimage_cancelled_tt:0 "§R归火盛夜巡礼被迫中断§!。"
 NAT_mavuika_fuel_minus_30_tt:0 "玛薇卡自身燃料：§R-30§!"
 NAT_loyalty_springs_minus_20_tt:0 "流泉之众忠诚度：§R-20§!"
 NAT_loyalty_canopy_minus_20_tt:0 "悬木人忠诚度：§R-20§!"
 NAT_loyalty_flower_minus_20_tt:0 "花羽会忠诚度：§R-20§!"
 NAT_all_preparation_is_done_tt:0 "我们已完成所有的准备"
 NAT_not_in_crisis:0 "今日无事"
 NAT_we_will_soon_win:0 "§G纳塔即将做好最后战争准备，我们很快将取得对深渊的彻底胜利！§!"
