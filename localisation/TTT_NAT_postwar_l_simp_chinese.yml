l_simp_chinese:
 ####战后基础国策###
 NAT_post_war_return:0 "归乡"
 NAT_post_war_return_desc:0 "战争结束了。纳塔人开始从避难所、山野与夜神之国边缘回到故土。"
 NAT_post_war_funerals:0 "葬礼与纪念"
 NAT_post_war_funerals_desc:0 "为战死者举行葬礼，让六部族共同记住他们的名字。"
 NAT_post_war_rebuild_homes:0 "重建家园"
 NAT_post_war_rebuild_homes_desc:0 "修复被战争摧毁的房屋、村落与城镇。"
 NAT_post_war_rebuild_factories:0 "重建工厂"
 NAT_post_war_rebuild_factories_desc:0 "让矿场、精炼厂与军工作坊重新运转。"
 NAT_post_war_veterans:0 "安置老兵"
 NAT_post_war_veterans_desc:0 "为退役战士提供土地、工作与医疗，让他们重新融入和平生活。"
 NAT_post_war_new_natlan:0 "新的纳塔"
 NAT_post_war_new_natlan_desc:0 "战争的废墟之上，纳塔必须决定自己将以何种面貌走向未来。"

 ####继承传统路线###
 NAT_tradition_path_1:0 "继承传统"
 NAT_tradition_path_1_desc:0 "延续火神与六部族的古老秩序，让圣火继续指引纳塔。"
 NAT_tradition_path_2:0 "重建圣火祭坛"
 NAT_tradition_path_2_desc:0 "修复圣火竞技场与各处祭坛，恢复传统仪式。"
 NAT_tradition_path_3:0 "六部族盟约重申"
 NAT_tradition_path_3_desc:0 "让六部族重新立誓，确认彼此之间的古老盟约。"
 NAT_tradition_path_4:0 "固定话事处"
 NAT_tradition_path_4_desc:0 "将话事处从临时机构转变为永久性部族议事机构。"
 NAT_tradition_path_5:0 "修复传统道路"
 NAT_tradition_path_5_desc:0 "恢复连接各部族圣地的传统道路。"
 NAT_tradition_path_6:0 "坚守封闭国策"
 NAT_tradition_path_6_desc:0 "纳塔继续与外界保持距离，依靠自身力量生存。"
 NAT_tradition_path_7:0 "夜神之国复兴"
 NAT_tradition_path_7_desc:0 "修复夜神之国与古名体系，让传统信仰继续守护纳塔。"
 NAT_tradition_path_8:0 "维持部族军队"
 NAT_tradition_path_8_desc:0 "保留各部族武装与传统战斗方式。"
 NAT_tradition_path_9:0 "永恒的圣火"
 NAT_tradition_path_9_desc:0 "纳塔选择留在旧日的道路之上，圣火不灭，传统永存。"

 ####部分改革路线###
 NAT_reform_path_1:0 "部分改革"
 NAT_reform_path_1_desc:0 "火神退居二线，话事处成为最高权力机构，纳塔开始尝试对外开放。"
 NAT_reform_path_2:0 "话事处扩权"
 NAT_reform_path_2_desc:0 "将决策权从火神手中逐步移交话事处。"
 NAT_reform_path_3:0 "开放边境"
 NAT_reform_path_3_desc:0 "允许外国商人与使团进入纳塔。"
 NAT_reform_path_4:0 "引入外国投资"
 NAT_reform_path_4_desc:0 "吸引枫丹、璃月等国的资本与技术。"
 NAT_reform_path_5:0 "建设港口与商路"
 NAT_reform_path_5_desc:0 "修建面向外界的新港口与商路。"
 NAT_reform_path_6:0 "改组话事处"
 NAT_reform_path_6_desc:0 "将话事处改组为现代议会，吸纳更多非部族代表。"
 NAT_reform_path_7:0 "教育改革"
 NAT_reform_path_7_desc:0 "引入外部知识，建立新的学校与研究机构。"
 NAT_reform_path_8:0 "改革军队"
 NAT_reform_path_8_desc:0 "以现代方式重组纳塔军队，保留传统但不再依赖旧制。"
 NAT_reform_path_9:0 "新生的纳塔"
 NAT_reform_path_9_desc:0 "纳塔选择了改变，走向一个更加开放、更加多元的未来。"
