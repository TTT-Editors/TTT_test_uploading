 ####话事处###
 NAT_Huashichu:0 "话事处"
 NAT_Huashichu_desc:0 "火神尚未从圣火中归来，纳塔暂时由六部族的话事处共同治理。话事处不是一个人，而是六部族长老、大萨满与各领域代表围坐的圆桌；它没有神明的权威，却拥有所有部族承认的仲裁权。"
 NAT_huashichu_tt:0 "六部族共治时期：话事处代表纳塔"

 ####1999 开局国策###
 NAT_pre_1999_opening:0 "新的一年"
 NAT_pre_1999_opening_desc:0 "圣火沉寂，火神未归。六部族的话事处又一次在没有神明注视的情况下主持纳塔的全年议程。我们要让这一年过得平稳、热闹，又不至于让任何人觉得我们忘记了圣火。"
 NAT_pre_six_tribes_agenda:0 "六部族议程"
 NAT_pre_six_tribes_agenda_desc:0 "把回声之子、流泉之众、悬木人、花羽会、沃陆之邦与烟谜主的事务排进同一年。矿场、温泉、猎场、天空、粮仓和记忆，每一张桌子都要有人说话。"
 NAT_pre_arena_maintenance:0 "修缮圣火竞技场"
 NAT_pre_arena_maintenance_desc:0 "归火圣夜巡礼终有一天会重新开幕。竞技场不能等到那时才修补，看台、通道、燃素火盆与选手休息区都要在和平时期恢复旧观。"
 NAT_pre_road_renovation:0 "翻新燃素商道"
 NAT_pre_road_renovation_desc:0 "连接各部族聚居地的商道正在被火山灰和货运驰轮车磨坏。翻新道路不只是为了贸易，更是为了让军队与信使在深渊警报响起时能更快抵达边境。"
 NAT_pre_phlogiston_survey:0 "燃素矿脉普查"
 NAT_pre_phlogiston_survey_desc:0 "纳塔的繁荣建立在燃素之上，但许多矿脉只靠口耳相传。话事处决定派测绘队走遍火山、矿洞与地热区，绘制第一份正式的燃素资源图。"
 NAT_pre_phlogiston_laboratory:0 "建立燃素研究所"
 NAT_pre_phlogiston_laboratory_desc:0 "过去燃素只被当作燃料使用。话事处希望学者们研究它的储存、精炼与安全应用，让纳塔不再依赖龙族时代遗留的旧机关。"
 NAT_pre_expand_refinery:0 "扩建燃素精炼厂"
 NAT_pre_expand_refinery_desc:0 "在火山脚下扩建精炼设施，把粗燃素转化为更稳定的工业燃料。这会让工厂与驰轮车跑得更久，也会让纳塔有更多储备迎接未知的一年。"
 NAT_pre_wait_for_flame:0 "静候圣火复苏"
 NAT_pre_wait_for_flame_desc:0 "一年的建设与庆典即将结束。话事处能做的已经做完：道路畅通，竞技场整洁，仓库充盈，部族之间没有大的争执。现在，所有人都在等待圣火重新燃起。"
 NAT_pre_tribal_games:0 "六部族竞技会"
 NAT_pre_tribal_games_desc:0 "在没有巡礼的年份，举办一场不那么正式的竞技会。比试攀岩、冲浪、狩猎、飞行与角力，让各部族的年轻人把竞争留在赛场上。"
 NAT_pre_harvest_festival:0 "丰收祭典"
 NAT_pre_harvest_festival_desc:0 "沃陆之邦的粮仓又一次装满。话事处主持祭典，邀请六部族共享食物、音乐与舞蹈，也让从战场上回来的人重新习惯和平的喧闹。"
 NAT_pre_springs_tourism:0 "流泉之众旅游季"
 NAT_pre_springs_tourism_desc:0 "流泉之众的温泉和海岸是纳塔少有的宁静之地。话事处拨款整修驿站与码头，欢迎各国商人和旅人来看一看没有黑云时的纳塔。"
 NAT_pre_memory_weaving:0 "烟谜主织史节"
 NAT_pre_memory_weaving_desc:0 "烟谜主用彩色织物记录历史。话事处邀请他们为这一年织一卷新史，把六部族的建设、争吵与和解都写进线里。"
 NAT_pre_coast_road:0 "海岸驿道"
 NAT_pre_coast_road_desc:0 "沿着流泉之众的海岸修筑驿道，连接港口、温泉镇与北方哨所。和平时期的驿道会在战争来临时变成补给线。"
 NAT_pre_volcano_geothermal:0 "图兰地热开发"
 NAT_pre_volcano_geothermal_desc:0 "图兰火山不只是威胁，也是纳塔最大的热源。话事处支持建造地热采集站，让火山的力量在和平时期也为人所用。"
 NAT_pre_dragon_partnership:0 "龙族合作训练"
 NAT_pre_dragon_partnership_desc:0 "纳塔人与龙族的关系远比外人想象的亲密。话事处鼓励猎龙人、兽医和绒翼龙骑手共同训练，为未来可能到来的战争保留默契。"

 ####火神复苏事件###
 NAT_pre_events.10.t:0 "圣火重燃"
 NAT_pre_events.10.d:0 "一年的平静并没有持续到最后。\n\n当话事处还在为下一个季度的道路预算争吵时，圣火竞技场中央的沉寂火盆突然自行亮起。火焰没有燃料，没有风，却越烧越高，几乎映红了整片夜空。\n\n最先赶到的是烟谜主的大萨满。她只看了一眼，便摘下头巾，向火焰躬身。\n\n「她回来了。」\n\n玛薇卡从火焰中走出。她仍穿着五百年前离开时的那件旧衣，眼神却比任何一位在座长老都清醒。她扫过话事处的圆桌，语气平静：\n\n「我答应过你们，会在需要我的时候回来。现在，纳塔需要我。」"
 NAT_pre_events.10.a:0 "欢迎回来，火神。"

 ####火神复苏新闻###
 NAT_news_events.30.t:0 "纳塔：火神玛薇卡自圣火中归来"
 NAT_news_events.30.d:0 "在沉寂一年之后，纳塔圣火竞技场中央的火焰于今夜自行重燃。六部族话事处随即宣布，火神玛薇卡已回到纳塔，重新接过最高统帅之位。\n\n据现场目击者称，玛薇卡出现时身着旧衣，神情平静，并未发表长篇演说。她只在话事处圆桌前说了一句话：纳塔需要我。\n\n各国观察员普遍认为，这意味着纳塔将结束长达一年的部族共治过渡期，重新进入火神领导的时代。"
 NAT_news_events.30.a:0 "圣火不灭。"
 NAT_news_events.30.b:0 "纳塔又要打仗了。"
