 ####全面战争民族精神###
 NAT_idea_last_battle:0 "最后一战"
 NAT_idea_last_battle_desc:0 "纳塔已经退无可退。所有部族、所有古名、所有燃素，都被投入这场孤注一掷的反攻。对深渊势力的进攻获得显著加成。"

 ####地面战阶段国策###
 NAT_gw_officer_1:0 "召集军官：旧部归队"
 NAT_gw_officer_1_desc:0 "战争爆发，纳塔各地的退役军官与老兵重新应召。"
 NAT_gw_officer_2:0 "召集军官：部族指挥官"
 NAT_gw_officer_2_desc:0 "从六部族中推举熟悉本地地形与深渊作战的指挥官。"
 NAT_gw_officer_3:0 "召集军官：英雄归位"
 NAT_gw_officer_3_desc:0 "瓦蕾莎与恰斯卡等英雄接受火神征召，重新出现在纳塔的战争序列中。"
 NAT_gw_officer_4:0 "召集军官：最高统帅部"
 NAT_gw_officer_4_desc:0 "建立统一指挥体系，提高全军计划上限与计划速度。"
 NAT_gw_army_1:0 "扩编军队：征召民兵"
 NAT_gw_army_1_desc:0 "动员各部落民兵，补充前线兵力。"
 NAT_gw_army_2:0 "扩编军队：整编新师"
 NAT_gw_army_2_desc:0 "将民兵与正规军混合整编，提高部队生命值与恢复能力。"
 NAT_gw_army_3:0 "扩编军队：动员法案"
 NAT_gw_army_3_desc:0 "根据前期战略选择，解锁全民动员或精兵训练。"
 NAT_gw_army_4:0 "扩编军队：战时医疗"
 NAT_gw_army_4_desc:0 "建立前线医疗与伤员回收体系，提高部队生命值与士气。"
 NAT_gw_prod_1:0 "生产军械：军工动员"
 NAT_gw_prod_1_desc:0 "所有民用工厂转入军工生产。"
 NAT_gw_prod_2:0 "生产军械：修复产线"
 NAT_gw_prod_2_desc:0 "修复被深渊破坏的工厂与产线。"
 NAT_gw_prod_3:0 "生产军械：技术加速"
 NAT_gw_prod_3_desc:0 "集中科研力量加速工业与步兵装备研发。"
 NAT_gw_prod_4:0 "生产军械：全面增产"
 NAT_gw_prod_4_desc:0 "进一步提高军工产出与前线攻击能力。"
 NAT_gw_pol_1:0 "政治动员：战争内阁"
 NAT_gw_pol_1_desc:0 "成立战时内阁，集中政治权力。"
 NAT_gw_pol_2:0 "政治动员：指挥体系"
 NAT_gw_pol_2_desc:0 "扩充指挥权力，提高战场协调能力。"
 NAT_gw_pol_3:0 "政治动员：稳定后方"
 NAT_gw_pol_3_desc:0 "稳定平民情绪，维持后方秩序。"
 NAT_gw_pol_4:0 "政治动员：全民意志"
 NAT_gw_pol_4_desc:0 "将纳塔人的意志转化为战争支持与组织度。"
 NAT_gw_aid_1:0 "对外求援：试探至冬"
 NAT_gw_aid_1_desc:0 "向至冬试探援助可能。"
 NAT_gw_aid_2:0 "对外求援：枫丹与蒙德"
 NAT_gw_aid_2_desc:0 "向枫丹、蒙德寻求外交与物资支持。"
 NAT_gw_aid_3:0 "对外求援：须弥"
 NAT_gw_aid_3_desc:0 "争取须弥教令院的支援。"
 NAT_gw_aid_4:0 "对外求援：璃月通道"
 NAT_gw_aid_4_desc:0 "在璃月未处于战争状态时，争取璃月的援助。"
 NAT_gw_last_battle:0 "最后一战"
 NAT_gw_last_battle_desc:0 "所有准备都已完成。纳塔将发起对深渊势力的最后攻势。"

 ####地下战斗阶段国策###
 NAT_uw_admin_1:0 "重建占领区行政"
 NAT_uw_admin_1_desc:0 "恢复被深渊占领地区的行政机构。"
