 NAT_uw_ind_1:0 "搜刮战利品"
 NAT_uw_ind_1_desc:0 "回收深渊战争遗留的装备与燃素。"
 NAT_uw_ind_2:0 "恢复民用工厂"
 NAT_uw_ind_2_desc:0 "修复被战火摧毁的民用工厂。"
 NAT_uw_ind_3:0 "重建军工厂"
 NAT_uw_ind_3_desc:0 "恢复军工生产，重建纳塔的武装力量。"
 NAT_uw_ind_4:0 "修建战时道路"
 NAT_uw_ind_4_desc:0 "在旧战场上修建新的运输网络。"
 NAT_uw_ind_5:0 "储备燃素"
 NAT_uw_ind_5_desc:0 "为下一阶段远征储备燃素。"
 NAT_uw_ind_6:0 "修复工业体系"
 NAT_uw_ind_6_desc:0 "全面修复纳塔工业。"
 NAT_uw_mil_1:0 "远征夜神之国"
 NAT_uw_mil_1_desc:0 "组织军队进入夜神之国。"
 NAT_uw_mil_2:0 "深渊战术研究"
 NAT_uw_mil_2_desc:0 "研究深渊部队的弱点与战术。"
 NAT_uw_mil_3:0 "精锐远征军"
 NAT_uw_mil_3_desc:0 "组建专门用于地下作战的精锐部队。"
 NAT_uw_mil_4:0 "装备夜战优化"
 NAT_uw_mil_4_desc:0 "为部队配备适合夜神之国环境的装备。"
 NAT_uw_mil_5:0 "夜神之国补给线"
 NAT_uw_mil_5_desc:0 "建立深入夜神之国的补给通道。"
 NAT_uw_mil_6:0 "地脉核心突击"
 NAT_uw_mil_6_desc:0 "向夜神之国核心发起最终突击。"

